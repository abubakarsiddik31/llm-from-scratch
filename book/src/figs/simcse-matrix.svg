<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="840" height="480" rx="12" fill="#fcfcfa"/>
  <text x="420" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b">Unsupervised SimCSE: dropout is the augmentation</text>

  <!-- left side: two encoder passes -->
  <rect x="50" y="120" width="200" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="150" y="149" text-anchor="middle" font-size="15" fill="#1e293b">sentence x_i</text>

  <line x1="150" y1="168" x2="150" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="150" y1="196" x2="100" y2="216" stroke="#475569" stroke-width="1.5"/>
  <line x1="150" y1="196" x2="200" y2="216" stroke="#475569" stroke-width="1.5"/>

  <rect x="30" y="220" width="140" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="243" text-anchor="middle" font-size="13.5" fill="#1e293b">Encoder</text>
  <text x="100" y="262" text-anchor="middle" font-size="12.5" fill="#2563eb">dropout mask z</text>

  <rect x="180" y="220" width="140" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="243" text-anchor="middle" font-size="13.5" fill="#1e293b">Encoder</text>
  <text x="250" y="262" text-anchor="middle" font-size="12.5" fill="#2563eb">dropout mask z'</text>

  <line x1="100" y1="276" x2="100" y2="308" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="276" x2="250" y2="308" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="312" width="140" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="339" text-anchor="middle" font-size="14.5" fill="#1e293b">h_i^z</text>
  <rect x="180" y="312" width="140" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="250" y="339" text-anchor="middle" font-size="14.5" fill="#1e293b">h_i^z'</text>

  <path d="M 100 356 C 100 400, 250 400, 250 356" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="175" y="412" text-anchor="middle" font-size="12.5" fill="#16a34a">same sentence, different masks: pull together</text>

  <!-- right side: similarity matrix -->
  <g>
    <!-- 5x5 matrix, cell 44, origin (480,120) -->
    <!-- diagonal cells -->
    <rect x="480" y="120" width="44" height="44" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="524" y="164" width="44" height="44" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="568" y="208" width="44" height="44" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="612" y="252" width="44" height="44" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="656" y="296" width="44" height="44" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <!-- off-diagonal cells -->
    <rect x="524" y="120" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="568" y="120" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="612" y="120" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="656" y="120" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="480" y="164" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="568" y="164" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="612" y="164" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="656" y="164" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="480" y="208" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="524" y="208" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="612" y="208" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="656" y="208" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="480" y="252" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="524" y="252" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="568" y="252" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="656" y="252" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="480" y="296" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="524" y="296" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="568" y="296" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="612" y="296" width="44" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  </g>
  <text x="590" y="106" text-anchor="middle" font-size="13.5" fill="#64748b">batch similarity matrix (N = 5 shown)</text>
  <text x="466" y="230" text-anchor="end" font-size="12.5" fill="#64748b">h_i^z</text>
  <text x="590" y="360" text-anchor="middle" font-size="12.5" fill="#64748b">h_j^z'</text>

  <!-- legend for matrix -->
  <rect x="480" y="390" width="18" height="18" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="506" y="404" font-size="13.5" fill="#334155">diagonal: positives (pull together)</text>
  <rect x="480" y="416" width="18" height="18" fill="#fef2f2" stroke="#fecaca"/>
  <text x="506" y="430" font-size="13.5" fill="#334155">off-diagonal: negatives (push apart)</text>

  <!-- arrows from embeddings to matrix -->
  <line x1="320" y1="334" x2="472" y2="230" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <line x1="320" y1="334" x2="472" y2="318" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)"/>

  <text x="420" y="468" text-anchor="middle" font-size="13.5" fill="#64748b">Loss: -log exp(sim(h_i^z, h_i^z')/tau) / sum_j exp(sim(h_i^z, h_j^z')/tau), with tau = 0.05. Symmetrized by swapping the two views.</text>
</svg>
