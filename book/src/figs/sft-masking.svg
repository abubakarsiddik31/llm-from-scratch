<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="840" height="420" rx="12" fill="#fcfcfa"/>
  <text x="420" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b">The response mask: loss only where the answer is</text>

  <!-- token strip: prompt | response | EOS | PAD -->
  <g font-size="13" text-anchor="middle">
    <!-- prompt cells -->
    <rect x="60"  y="80" width="72" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="136" y="80" width="72" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="212" y="80" width="72" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="288" y="80" width="72" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="96"  y="106" fill="#64748b">BOS</text>
    <text x="172" y="106" fill="#64748b">templ.</text>
    <text x="248" y="106" fill="#64748b">instr.</text>
    <text x="324" y="106" fill="#64748b">…Resp:</text>
    <!-- response cells -->
    <rect x="384" y="80" width="72" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="460" y="80" width="72" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="536" y="80" width="72" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="612" y="80" width="46" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="420" y="106" fill="#166534">ans₁</text>
    <text x="496" y="106" fill="#166534">ans₂</text>
    <text x="572" y="106" fill="#166534">ans₃</text>
    <text x="635" y="106" fill="#166534">EOS</text>
    <!-- pad cells -->
    <rect x="682" y="80" width="46" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <rect x="732" y="80" width="46" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="705" y="106" fill="#94a3b8">PAD</text>
    <text x="755" y="106" fill="#94a3b8">PAD</text>
  </g>

  <!-- brace labels under the strip -->
  <path d="M 60 140 L 60 148 L 360 148 L 360 140" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="166" text-anchor="middle" font-size="13.5" fill="#dc2626">input: label −1 (ignored)</text>
  <path d="M 384 140 L 384 148 L 658 148 L 658 140" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="521" y="166" text-anchor="middle" font-size="13.5" fill="#16a34a">response + EOS: label = token (taught)</text>

  <!-- shift diagram -->
  <text x="420" y="216" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1e293b">One position of lookahead is what the loss teaches</text>

  <!-- input row -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="110" y="240" width="76" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="190" y="240" width="76" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="270" y="240" width="76" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="350" y="240" width="76" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="148" y="264" fill="#1e293b">…Resp:</text>
    <text x="228" y="264" fill="#1e293b">ans₁</text>
    <text x="308" y="264" fill="#1e293b">ans₂</text>
    <text x="388" y="264" fill="#1e293b">ans₃</text>
    <text x="96" y="264" text-anchor="end" fill="#475569" font-size="13">input x</text>

    <!-- target row -->
    <rect x="110" y="320" width="76" height="40" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <rect x="190" y="320" width="76" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="270" y="320" width="76" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="350" y="320" width="76" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="148" y="344" fill="#dc2626">−1</text>
    <text x="228" y="344" fill="#166534">ans₁</text>
    <text x="308" y="344" fill="#166534">ans₂</text>
    <text x="388" y="344" fill="#166534">EOS</text>
    <text x="96" y="344" text-anchor="end" fill="#475569" font-size="13">labels y</text>
  </g>

  <!-- shift arrows -->
  <line x1="148" y1="284" x2="190" y2="316" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="228" y1="284" x2="270" y2="316" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="308" y1="284" x2="350" y2="316" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>

  <text x="560" y="300" font-size="13.5" fill="#475569">the last prompt token must</text>
  <text x="560" y="319" font-size="13.5" fill="#475569">produce the first answer token;</text>
  <text x="560" y="338" font-size="13.5" fill="#475569">the last answer token must</text>
  <text x="560" y="357" font-size="13.5" fill="#475569">produce EOS (learning to stop)</text>

  <text x="420" y="398" text-anchor="middle" font-size="13" fill="#64748b">padded example, MAX_SEQ_LEN = 512 · PAD cells are masked like prompt cells</text>
</svg>
