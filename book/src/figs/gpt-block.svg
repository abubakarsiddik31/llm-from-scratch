<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrRes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="720" height="880" rx="12" fill="#fcfcfa"/>

  <!-- input -->
  <rect x="160" y="28" width="300" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="310" y="55" text-anchor="middle" font-size="15.5" fill="#1e293b">Input token ids (B, T)</text>
  <line x1="310" y1="72" x2="310" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- embeddings -->
  <rect x="160" y="102" width="300" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="310" y="129" text-anchor="middle" font-size="15" fill="#1e293b">Token emb + position emb</text>
  <line x1="310" y1="146" x2="310" y2="228" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- transformer block container -->
  <rect x="80" y="180" width="500" height="446" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="100" y="206" font-size="14.5" font-weight="600" fill="#475569">Transformer block, repeated N times</text>

  <!-- LN1 -->
  <rect x="185" y="230" width="250" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="310" y="254" text-anchor="middle" font-size="14.5" fill="#1e293b">LayerNorm</text>
  <line x1="310" y1="268" x2="310" y2="296" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MHA -->
  <rect x="185" y="298" width="250" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="310" y="330" text-anchor="middle" font-size="15" fill="#1e293b">Multi-head self-attention</text>
  <line x1="310" y1="350" x2="310" y2="376" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- add 1 -->
  <circle cx="310" cy="392" r="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="310" y="398" text-anchor="middle" font-size="18" font-weight="600" fill="#16a34a">+</text>
  <line x1="310" y1="408" x2="310" y2="434" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- residual 1 -->
  <path d="M 310 244 H 540 V 392 H 330" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrRes)"/>
  <text transform="rotate(-90 556 320)" x="556" y="320" text-anchor="middle" font-size="12" fill="#16a34a">residual</text>

  <!-- LN2 -->
  <rect x="185" y="436" width="250" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="310" y="460" text-anchor="middle" font-size="14.5" fill="#1e293b">LayerNorm</text>
  <line x1="310" y1="474" x2="310" y2="502" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FFN -->
  <rect x="185" y="504" width="250" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="310" y="536" text-anchor="middle" font-size="15" fill="#1e293b">Feed-forward (4x expansion)</text>
  <line x1="310" y1="556" x2="310" y2="582" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- add 2 -->
  <circle cx="310" cy="598" r="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="310" y="604" text-anchor="middle" font-size="18" font-weight="600" fill="#16a34a">+</text>
  <!-- residual 2 -->
  <path d="M 310 450 H 528 V 598 H 330" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrRes)"/>
  <!-- line 310,598 -> down: start after circle bottom -->
  <line x1="310" y1="614" x2="310" y2="646" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- final LN -->
  <rect x="185" y="648" width="250" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="310" y="673" text-anchor="middle" font-size="14.5" fill="#1e293b">Final LayerNorm</text>
  <line x1="310" y1="688" x2="310" y2="716" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- head -->
  <rect x="185" y="718" width="250" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="310" y="745" text-anchor="middle" font-size="15" fill="#1e293b">Linear head (vocab_size)</text>
  <line x1="310" y1="762" x2="310" y2="790" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- logits -->
  <rect x="185" y="792" width="250" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="310" y="819" text-anchor="middle" font-size="15" fill="#1e293b">Output logits (B, T, vocab_size)</text>

  <!-- pre-LN note -->
  <text x="100" y="864" font-size="12.5" fill="#64748b">Pre-LN: each sub-layer is x + Sublayer(LayerNorm(x)). Residuals tap the input before the norm.</text>
</svg>
