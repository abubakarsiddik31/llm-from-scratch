<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="840" height="430" rx="12" fill="#fcfcfa"/>
  <text x="420" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b">LoRA: a low-rank update alongside a frozen weight</text>

  <!-- left: the parallel path -->
  <text x="250" y="76" text-anchor="middle" font-size="14" fill="#475569">training &amp; inference (before merge)</text>

  <rect x="60" y="120" width="80" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="151" text-anchor="middle" font-size="16" fill="#1e293b">x</text>

  <!-- frozen W path -->
  <line x1="140" y1="138" x2="220" y2="138" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="224" y="112" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="299" y="134" text-anchor="middle" font-size="14.5" fill="#1e293b">W (frozen)</text>
  <text x="299" y="153" text-anchor="middle" font-size="12" fill="#64748b">no gradients, ever</text>

  <!-- LoRA path -->
  <line x1="140" y1="162" x2="220" y2="212" stroke="#3b82f6" stroke-width="1.6"/>
  <rect x="224" y="188" width="70" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="259" y="212" text-anchor="middle" font-size="14" fill="#1e293b">A</text>
  <text x="259" y="228" text-anchor="middle" font-size="11" fill="#2563eb">r × 768</text>
  <line x1="294" y1="212" x2="322" y2="212" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrB)"/>
  <rect x="326" y="188" width="70" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="361" y="212" text-anchor="middle" font-size="14" fill="#1e293b">B</text>
  <text x="361" y="228" text-anchor="middle" font-size="11" fill="#2563eb">2304 × r</text>
  <text x="240" y="258" text-anchor="middle" font-size="11.5" fill="#2563eb">trainable · B starts at 0</text>

  <!-- sum -->
  <line x1="374" y1="138" x2="470" y2="160" stroke="#475569" stroke-width="1.6"/>
  <line x1="396" y1="212" x2="470" y2="176" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="486" cy="168" r="17" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="486" y="174" text-anchor="middle" font-size="17" fill="#1e293b">+</text>
  <line x1="503" y1="168" x2="560" y2="168" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="564" y="142" width="90" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="609" y="173" text-anchor="middle" font-size="15.5" fill="#1e293b">y</text>
  <text x="672" y="158" font-size="12.5" fill="#64748b">y = Wx + (α/r)·B(Ax)</text>
  <text x="672" y="176" font-size="12.5" fill="#2563eb">α/r = 2 (α=16, r=8)</text>

  <!-- right: the merge -->
  <text x="250" y="310" text-anchor="middle" font-size="14" fill="#475569">deploy: fold the update into W</text>
  <rect x="80" y="330" width="250" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="205" y="352" text-anchor="middle" font-size="14.5" fill="#166534">W' = W + (α/r)·B·A</text>
  <text x="205" y="371" text-anchor="middle" font-size="12" fill="#16a34a">one matrix, original shape</text>
  <line x1="330" y1="356" x2="420" y2="356" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="424" y="330" width="200" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="524" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">same architecture</text>
  <text x="524" y="371" text-anchor="middle" font-size="12" fill="#64748b">zero added latency</text>
  <text x="660" y="356" font-size="12.5" fill="#64748b">adapters gone</text>
</svg>
